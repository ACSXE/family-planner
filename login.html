<!doctype html>
<html lang="es" data-page="login">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Planner</title>
  <!-- Antes que nada: con sesión guardada se muestra la pantalla de carga, no el formulario -->
  <script src="js/config.js"></script>
  <script src="js/core/guard.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <!-- Pantalla de carga: se ve mientras <html> tiene la clase is-loading -->
  <div class="app-loader" role="status" aria-live="polite">
    <div class="app-loader__mark" aria-hidden="true">
      <span class="app-loader__spinner"></span>
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
    </div>
    <span class="app-loader__text">Cargando…</span>
  </div>
  <main class="login">
    <form class="login__card" id="login-form" novalidate>
      <div class="login__brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
        <h1>Family Planner</h1>
      </div>

      <!-- Mensajes de la pantalla: el informativo y el de error ocupan el mismo sitio y tienen el mismo formato -->
      <p class="login__msg login__msg--info" id="login-notice" role="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Tu sesión se ha cerrado por inactividad.</span>
      </p>
      <p class="login__msg login__msg--error" id="login-error" role="alert" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor"/></svg>
        <span id="login-error-text"></span>
      </p>

      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <!-- Oculta por defecto; el botón del ojo permite verla -->
        <div class="password">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="password__toggle" id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
    </form>
  </main>

  <script src="js/vendor/supabase-js-2.118.0.js"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

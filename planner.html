<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app">
  <!-- Iconos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-planner" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 17v-3M12 17v-6M14.5 17v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-exitfull" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="shellbar">
    <div class="shellbar__brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
      <span>Family Planner</span>
    </div>
    <div class="shellbar__user">
      <span class="shellbar__name" id="user-name"></span>
      <button class="btn btn--shell" id="logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <div class="workspace">
  <nav class="sidenav" aria-label="Navegación principal">
    <a class="sidenav__item" href="#planner" data-view="planner">
      <svg class="sidenav__icon" aria-hidden="true"><use href="#i-planner"/></svg>
      <span class="sidenav__label">Calendario</span>
    </a>
    <a class="sidenav__item" href="#reports" data-view="reports">
      <svg class="sidenav__icon" aria-hidden="true"><use href="#i-report"/></svg>
      <span class="sidenav__label">Informes</span>
    </a>
  </nav>

  <main class="fcl" id="fcl">
    <!-- Columna 1: calendario anual -->
    <section class="col" id="col1" aria-labelledby="cal-title">
      <header class="col__header">
        <div class="col__row">
          <h1 class="col__title" id="cal-title">Calendario</h1>
          <div class="year-nav">
            <button class="icon-btn" id="year-prev" type="button" aria-label="Año anterior"><svg><use href="#i-left"/></svg></button>
            <span class="year-nav__label" id="year-label"></span>
            <button class="icon-btn" id="year-next" type="button" aria-label="Año siguiente"><svg><use href="#i-right"/></svg></button>
          </div>
          <button class="btn btn--ghost" id="btn-today" type="button">Hoy</button>
        </div>
        <ul class="legend" id="legend" aria-label="Miembros de la familia"></ul>
      </header>
      <div class="col__body">
        <div class="months" id="months"></div>
      </div>
    </section>

    <div class="sep" id="sep-a"><button class="sep__btn" type="button"></button></div>

    <!-- Columna 2: vista horaria del día -->
    <section class="col" id="col2" aria-labelledby="day-title">
      <header class="col__header">
        <div class="col__row">
          <button class="btn btn--ghost btn--back" id="back-day" type="button"><svg><use href="#i-left"/></svg>Calendario</button>
          <div class="col__heading">
            <h2 class="col__title" id="day-title"></h2>
            <p class="col__subtitle" id="day-weekday"></p>
          </div>
          <div class="col__actions">
            <button class="icon-btn" id="day-prev" type="button" aria-label="Día anterior"><svg><use href="#i-left"/></svg></button>
            <button class="icon-btn" id="day-next" type="button" aria-label="Día siguiente"><svg><use href="#i-right"/></svg></button>
            <button class="icon-btn" id="fs-day" type="button" aria-label="Pantalla completa"><svg><use href="#i-full"/></svg></button>
            <button class="icon-btn" id="close-day" type="button" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button>
          </div>
        </div>
        <p class="col__hint">Pulsa una franja horaria para crear o ver una actividad</p>
      </header>
      <div class="col__body" id="day-body">
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <div class="sep" id="sep-b"><button class="sep__btn" type="button"></button></div>

    <!-- Columna 3: detalle de la actividad -->
    <section class="col" id="col3" aria-labelledby="detail-title">
      <header class="col__header">
        <div class="col__row">
          <button class="btn btn--ghost btn--back" id="back-detail" type="button"><svg><use href="#i-left"/></svg>Día</button>
          <div class="col__heading">
            <h2 class="col__title" id="detail-title">Actividad</h2>
          </div>
          <div class="col__actions">
            <button class="icon-btn" id="fs-detail" type="button" aria-label="Pantalla completa"><svg><use href="#i-full"/></svg></button>
            <button class="icon-btn" id="close-detail" type="button" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button>
          </div>
        </div>
      </header>
      <div class="col__body">
        <form class="detail" id="detail-form" novalidate>
          <div class="field">
            <label for="f-name">Nombre <span class="req" aria-hidden="true">*</span></label>
            <input id="f-name" type="text" maxlength="120" required>
          </div>
          <div class="field">
            <label for="f-desc">Descripción</label>
            <textarea id="f-desc" rows="4" maxlength="2000"></textarea>
          </div>
          <div class="field">
            <label for="f-date">Fecha <span class="req" aria-hidden="true">*</span></label>
            <input id="f-date" type="date" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-start">Hora inicio <span class="req" aria-hidden="true">*</span></label>
              <input id="f-start" type="time" step="300" required>
            </div>
            <div class="field">
              <label for="f-end">Hora fin <span class="req" aria-hidden="true">*</span></label>
              <input id="f-end" type="time" step="300" required>
            </div>
          </div>
          <fieldset class="field">
            <legend>Asistentes <span class="req" aria-hidden="true">*</span></legend>
            <div class="chips" id="f-attendees"></div>
          </fieldset>
          <div class="field">
            <label for="f-companion">Acompañante <span class="req" id="companion-req" aria-hidden="true" hidden>*</span></label>
            <select id="f-companion">
              <option value=""></option>
            </select>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="detail__actions">
            <button class="btn btn--primary" type="submit">Guardar</button>
            <button class="btn btn--ghost" id="btn-cancel" type="button">Cancelar</button>
            <button class="btn btn--danger" id="btn-delete" type="button">Eliminar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Pantalla Informes (de momento en blanco) -->
  <section class="reports" id="reports-view" aria-labelledby="reports-title" hidden>
    <header class="col__header">
      <div class="col__row"><h1 class="col__title" id="reports-title">Informes</h1></div>
    </header>
    <div class="reports__body"></div>
  </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>

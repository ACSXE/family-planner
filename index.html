<title>Family Planner</title>
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.lang = 'es'; document.addEventListener('DOMContentLoaded', () => document.body.classList.add('login-page'));</script>
  <main class="login">
    <form class="login__card" id="login-form" novalidate>
      <div class="login__brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
        <h1>Family Planner</h1>
      </div>

      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <!-- type="password": el navegador nunca muestra los caracteres tecleados -->
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <p class="login__error" id="login-error" role="alert" hidden></p>

      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>

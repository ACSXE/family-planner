<!-- Pantalla Calendario: Flexible Column Layout de 3 columnas. Lógica en js/views/planner.js -->
  <main class="fcl" id="fcl" data-view-root>
    <!-- Columna 1: calendario anual -->
    <section class="col" id="col1" aria-labelledby="cal-title">
      <header class="col__header">
        <div class="col__row">
          <h1 class="col__title" id="cal-title">Calendario</h1>
          <div class="year-nav">
            <button class="icon-btn" id="year-prev" type="button" aria-label="Año anterior"><svg><use href="#i-left"/></svg></button>
            <span class="year-nav__label" id="year-label"></span>
            <button class="icon-btn" id="year-next" type="button" aria-label="Año siguiente"><svg><use href="#i-right"/></svg></button>
          </div>
          <button class="btn btn--ghost" id="btn-today" type="button">Hoy</button>
        </div>
        <ul class="legend" id="legend" aria-label="Miembros de la familia"></ul>
      </header>
      <div class="col__body">
        <div class="months" id="months"></div>
      </div>
    </section>

    <div class="sep" id="sep-a"><button class="sep__btn" type="button"></button></div>

    <!-- Columna 2: vista horaria del día -->
    <section class="col" id="col2" aria-labelledby="day-title">
      <header class="col__header">
        <div class="col__row">
          <button class="btn btn--ghost btn--back" id="back-day" type="button"><svg><use href="#i-left"/></svg>Calendario</button>
          <div class="col__heading">
            <h2 class="col__title" id="day-title"></h2>
            <p class="col__subtitle col__subtitle--strong" id="day-weekday"></p>
          </div>
          <div class="col__actions">
            <button class="icon-btn" id="day-prev" type="button" aria-label="Día anterior"><svg><use href="#i-left"/></svg></button>
            <button class="icon-btn" id="day-next" type="button" aria-label="Día siguiente"><svg><use href="#i-right"/></svg></button>
            <button class="icon-btn" id="fs-day" type="button" aria-label="Pantalla completa"><svg><use href="#i-full"/></svg></button>
            <button class="icon-btn" id="close-day" type="button" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button>
          </div>
        </div>
        <p class="col__hint">Pulsa una franja horaria para crear o ver una actividad</p>
      </header>
      <div class="col__body" id="day-body">
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <div class="sep" id="sep-b"><button class="sep__btn" type="button"></button></div>

    <!-- Columna 3: detalle de la actividad -->
    <section class="col" id="col3" aria-labelledby="detail-title">
      <header class="col__header">
        <div class="col__row">
          <button class="btn btn--ghost btn--back" id="back-detail" type="button"><svg><use href="#i-left"/></svg>Día</button>
          <div class="col__heading">
            <h2 class="col__title" id="detail-title">Actividad</h2>
          </div>
          <div class="col__actions">
            <button class="icon-btn" id="fs-detail" type="button" aria-label="Pantalla completa"><svg><use href="#i-full"/></svg></button>
            <button class="icon-btn" id="close-detail" type="button" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button>
          </div>
        </div>
      </header>
      <div class="col__body">
        <form class="detail" id="detail-form" novalidate>
          <div class="field">
            <label for="f-name">Nombre <span class="req" aria-hidden="true">*</span></label>
            <input id="f-name" type="text" maxlength="120" required>
          </div>
          <div class="field">
            <label for="f-desc">Descripción</label>
            <textarea id="f-desc" rows="4" maxlength="2000"></textarea>
          </div>
          <div class="field">
            <label for="f-date">Fecha <span class="req" aria-hidden="true">*</span></label>
            <input id="f-date" type="date" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-start">Hora inicio <span class="req" aria-hidden="true">*</span></label>
              <input id="f-start" type="time" step="300" required>
            </div>
            <div class="field">
              <label for="f-end">Hora fin <span class="req" aria-hidden="true">*</span></label>
              <input id="f-end" type="time" step="300" required>
            </div>
          </div>
          <fieldset class="field">
            <legend>Asistentes <span class="req" aria-hidden="true">*</span></legend>
            <div class="chips" id="f-attendees"></div>
          </fieldset>
          <div class="field">
            <label for="f-companion">Acompañante <span class="req" id="companion-req" aria-hidden="true" hidden>*</span></label>
            <select id="f-companion">
              <option value=""></option>
            </select>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="detail__actions">
            <button class="btn btn--primary" type="submit">Guardar</button>
            <button class="btn btn--ghost" id="btn-cancel" type="button">Cancelar</button>
            <button class="btn btn--danger" id="btn-delete" type="button">Eliminar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

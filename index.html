<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Planner</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <!--
    Armazón de la aplicación: barra superior, menú de usuario y menú lateral.
    Cada pantalla vive en views/<id>.html con su CSS (css/views/<id>.css) y su
    JavaScript (js/views/<id>.js); js/core/router.js la carga dentro de
    .workspace al elegirla en el menú lateral. El menú se genera a partir de
    FP_CONFIG.views (js/config.js).
  -->
  <div class="app">
  <!-- Iconos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-planner" viewBox="0 0 24 24"><path d="M5.5 4.5h13A2.5 2.5 0 0 1 21 7v2.5H3V7a2.5 2.5 0 0 1 2.5-2.5z" fill="currentColor" opacity=".22"/><rect x="3" y="4.5" width="18" height="16.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.5v4M16 2.5v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><g fill="currentColor"><rect x="6" y="12" width="2.4" height="2.2" rx=".5"/><rect x="10.8" y="12" width="2.4" height="2.2" rx=".5"/><rect x="15.6" y="12" width="2.4" height="2.2" rx=".5"/><rect x="6" y="16.2" width="2.4" height="2.2" rx=".5"/><rect x="10.8" y="16.2" width="2.4" height="2.2" rx=".5"/></g></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 17v-3M12 17v-6M14.5 17v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-report-activity" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.5v4M16 2.5v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 17.5v-3M10.5 17.5v-6M13.5 17.5v-4.5M16.5 17.5v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <header class="shellbar">
    <div class="shellbar__brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
      <span>Family Planner</span>
    </div>
    <div class="shellbar__user">
      <button class="avatar avatar--sm" id="user-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="user-menu">
        <span id="user-initials"></span>
      </button>
      <div class="user-menu" id="user-menu" role="dialog" aria-label="Cuenta" hidden>
        <div class="user-menu__body">
          <span class="avatar avatar--lg" aria-hidden="true" id="user-initials-lg"></span>
          <p class="user-menu__name" id="user-fullname"></p>
          <p class="user-menu__email" id="user-email"></p>
        </div>
        <div class="user-menu__footer">
          <button class="user-menu__logout" id="logout" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7.1 6.3a8 8 0 1 0 9.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <nav class="sidenav" id="sidenav" aria-label="Navegación principal"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Aviso de cierre de sesión por inactividad (js/core/idle.js) -->
  <div class="modal" id="idle-dialog" hidden>
    <div class="modal__box" role="alertdialog" aria-modal="true" aria-labelledby="idle-title" aria-describedby="idle-text" tabindex="-1">
      <!-- Barra con el logo y el nombre, como la cabecera de la aplicación -->
      <div class="modal__bar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2" fill="currentColor"/></svg>
        <span>Family Planner</span>
      </div>
      <div class="modal__body">
        <div class="modal__head">
          <span class="modal__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <h2 class="modal__title" id="idle-title">¿Sigues ahí?</h2>
        </div>
        <p class="modal__text" id="idle-text">Tu sesión se cerrará por inactividad en <strong class="modal__nowrap"><span id="idle-countdown">60</span> <span id="idle-unit">segundos</span></strong>.</p>
        <div class="modal__actions">
          <button class="btn btn--ghost" id="idle-logout" type="button">Cerrar sesión</button>
          <button class="btn btn--primary" id="idle-stay" type="button">Seguir conectado</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="js/vendor/supabase-js-2.118.0.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/family.js"></script>
  <script src="js/core/time.js"></script>
  <script src="js/core/multiselect.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/idle.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
